[package]
name = "yueting"
version = "1.0.0"
description = "悦听 · 本地音乐播放器"
authors = ["local"]
edition = "2021"

[lib]
name = "yueting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
