<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悦听 · 浏览器自检</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: var(--bg); color: var(--text); padding: 20px; font-family: var(--font); }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; }
    .case { display: flex; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; align-items: baseline; }
    .case + .case { margin-top: 3px; }
    .case.pass { background: rgba(67,160,71,.12); }
    .case.fail { background: rgba(229,57,53,.14); }
    .tag { font-weight: 700; }
    .pass .tag { color: var(--success); }
    .fail .tag { color: var(--danger); }
    .err { color: var(--danger); font-size: 12px; display: block; margin-top: 3px; }
    .summary { margin: 16px 0; padding: 12px 14px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>悦听 · 浏览器自检（真实 IndexedDB）</h1>
    <p style="color:var(--text-2);font-size:13px">本页在独立数据库 <code>yueting-selftest</code> 中运行，不会影响你的音乐数据。</p>
    <div class="summary" id="summary">运行中…</div>
    <div id="cases"></div>
  </div>
  <script type="module" src="js/dev/selftest.js"></script>
</body>
</html>
