<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悦听 · 界面自检</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: var(--bg); color: var(--text); padding: 20px; font-family: var(--font); }
    .wrap { max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .layout { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
    .cases { flex: 1; min-width: 420px; }
    .case { display: flex; gap: 10px; padding: 8px 11px; border-radius: 8px; font-size: 13.5px; align-items: baseline; }
    .case + .case { margin-top: 4px; }
    .case.pass { background: rgba(67,160,71,.12); }
    .case.fail { background: rgba(229,57,53,.14); }
    .tag { font-weight: 700; flex-shrink: 0; }
    .pass .tag { color: var(--success); }
    .fail .tag { color: var(--danger); }
    .err { color: var(--danger); font-size: 12px; display: block; margin-top: 3px; }
    .summary { margin: 14px 0; padding: 12px 14px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
    .phone { border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-lg); background: var(--bg); }
    iframe { width: 430px; height: 760px; border: none; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>悦听 · 界面自检（iframe 驱动真实 App）</h1>
    <p style="color:var(--text-2);font-size:13px">
      在独立数据库 <code>yueting-uitest</code> 中运行，不会影响你的音乐数据。
    </p>
    <div class="summary" id="summary">运行中…</div>
    <div class="layout">
      <div class="cases" id="cases"></div>
      <div class="phone"><iframe id="app" src="index.html?db=yueting-uitest#/home" title="悦听应用"></iframe></div>
    </div>
  </div>
  <script type="module" src="js/dev/uitest.js"></script>
</body>
</html>
